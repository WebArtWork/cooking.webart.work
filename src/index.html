		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<script>
			try {
				const storedMode = localStorage.getItem('theme.mode');
				const preferredMode =
					storedMode === 'dark' || storedMode === 'light'
						? storedMode
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.setAttribute('data-mode', preferredMode);
			} catch {}
		</script>

		<meta
			name="description"
			content="Learn cooking through 288 English and Ukrainian theories: short explanations, detailed principles, practical examples and linked sources."
		/>

		<meta name="theme-color" content="#F7F1E8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#140B05" media="(prefers-color-scheme: dark)" />
